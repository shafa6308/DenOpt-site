<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEN OPT — Оптовий магазин одягу та взуття</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: #1a252f; color: #fff; padding: 20px; text-align: center; }
        header h1 { font-size: 28px; margin-bottom: 5px; }
        header p { font-size: 14px; color: #bdc3c7; }
        .contacts-bar { background: #2c3e50; color: #fff; text-align: center; padding: 12px; font-size: 15px; }
        .contacts-bar a { color: #2ecc71; text-decoration: none; font-weight: bold; margin: 0 8px; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .cat-btn { background: #fff; border: 1px solid #ddd; padding: 10px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .cat-btn.active { background: #3498db; color: #fff; border-color: #3498db; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 8px; border: 1px solid #e1e8ed; overflow: hidden; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; }
        .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-weight: bold; margin-bottom: 8px; font-size: 16px; }
        .product-price { font-size: 18px; color: #e74c3c; font-weight: bold; margin-bottom: 12px; }
        .btn-order { background: #27ae60; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; }
        .btn-order:hover { background: #219150; }
        footer { text-align: center; padding: 20px; color: #7f8c8d; font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>DEN OPT</h1>
        <p>Оптовий каталог товарів</p>
    </header>

    <div class="contacts-bar">
        📞 Телефон / Viber: <a href="viber://chat?number=%2B380972424666">097-24-24-666</a> | 
        💬 Telegram: <a href="https://t.me/0680516308" target="_blank">068-051-63-08</a>
    </div>

    <div class="container">
        <!-- Кнопки категорій -->
        <div class="categories">
            <button class="cat-btn active">Всі товари</button>
            <button class="cat-btn">Жіночий одяг</button>
            <button class="cat-btn">Чоловічий одяг</button>
            <button class="cat-btn">Взуття</button>
            <button class="cat-btn">Аксесуари</button>
            <button class="cat-btn">Дрібна техніка</button>
        </div>

        <!-- Сітка каталогу -->
        <div class="catalog-grid">
            <div class="product-card">
                <div class="product-img">Фото товару</div>
                <div class="product-info">
                    <div class="product-title">Зразок товару №1</div>
                    <div class="product-price">Уточнюйте опт</div>
                    <a href="viber://chat?number=%2B380972424666" class="btn-order">Замовити у Viber</a>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img">Фото товару</div>
                <div class="product-info">
                    <div class="product-title">Зразок товару №2</div>
                    <div class="product-price">Уточнюйте опт</div>
                    <a href="https://t.me/0680516308" class="btn-order" style="background:#2980b9;">Замовити в Telegram</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 DEN OPT. Усі права захищені.
    </footer>

</body>
</html>
